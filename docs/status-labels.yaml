components:
  readable-coordinator-brief:
    availability: Custom
    mode: deployed-existing-target-with-private-workbench-reader
    implementation: agents.coordinator_brief
    note: Opt-in plain-text prompt output using the existing native Fabric/document tools. The direct delegated Logic App retains raw response JSON and publishes a create-only Markdown review after source-scope, tool-success, document-shape and blocker-coverage guards. Site/case/program/version metadata scopes the loopback workbench list/reader; no raw traces or arbitrary Blob URLs are exposed. These guards do not independently verify every narrative claim. The brief recommends review, never authorizes or executes rework, generates packages or updates Dataverse. Older structured versions and default bootstrap remain unchanged. Actual private Blob publication and employee reader are verified on the existing synthetic target; no fresh-target or continuous Activator proof is claimed.
  local-close-out-workbench:
    availability: Custom
    mode: local-fixture-ui-with-delegated-assistant-and-registered-validation
    implementation: agents.workbench
    note: React case queue/detail with a left-side assistant. Case cards are labelled seed fixtures, not live Fabric/Dataverse state. The separate pinned Foundry assistant uses an explicitly created UserEntraToken Fabric connection and the existing managed-identity document IQ connection; assistant publication does not edit the coordinator or its connections. Actual operator-scoped native Fabric and document retrieval were verified against the Stockholm fixture's exact KQL sourceRef and blockers. The loopback API requires both retrieval receipts, forwarded site/case/program/scenario and matching fixture-shaped provenance; failures have no seed fallback. This is not browser-user isolation or unattended coordinator authentication. Optional registered-photo validation attaches pinned bytes and publication context to the existing validator; durable local IDs prevent automatic repeat inference, with publisher-ledger confirmation separate from model completion. An operator UI submission verified live photo assessment and publisher confirmation of all three events. The panel separates photo review from event delivery, shows elapsed progress and collapses technical IDs. Automatic downstream completion remains unverified through this UI; Fabric capacity must be active. No arbitrary uploads, approvals, business actions or packages.
  guided-demo-installer:
    availability: Custom
    mode: implemented-connected-runtime-unverified
    implementation: scripts/deploy-demo.ps1
    note: Foundation-first deployment, guided prerequisites, target discovery, nonsecret resumable state, agent/runtime publication, synthetic knowledge and pinned playground inputs. Both agent versions are printed before an optional stop without Fabric changes. Only approved narrow updates to compatible existing Fabric bindings/schedules; no Fabric provisioning or callback credential creation. Focused offline installer tests do not establish connected runtime acceptance. Owner handoffs remain for unsupported grants/connections; final enablement is explicit.
  fresh-portal-deployment:
    availability: Custom
    mode: implemented-not-fresh-cloud-verified
    implementation: infra/fresh
    note: Template includes flow hosts and MI grants; output bootstrap command registers target-bound agents/OpenAPI and publishes locked ZIPs without inference. Actual versions replace pending-publication settings; both workflows remain Disabled until the manual checklist is completed. Public button loads main; bootstrap must use the same published revision. Native Fabric grants/bindings are external. Fresh-target deployment remains unverified. No hosted agent, Fabric provisioning, automatic credential fallback or Storage policy exception.
  headless-blob-activator-flow:
    availability: Custom
    mode: direct-coordinator-delegated-native-grounding-verified
    implementation: docs/HEADLESS-FLOW.md
    note: Existing-target coordinator v17 is proven through an actual existing Fabric dispatch, native Fabric/document IQ and response Blob. Exact live-test revision, all three Stockholm blockers and latest-only validation citations were checked independently. The approved exception uses a dedicated public OAuth client and Key Vault-held renewable user credential; Logic App MI reads/rotates only that secret, while Blob output remains MI. Runs are serialized with asynchronous acknowledgement. Native KQL Data Agent MI/SPN authentication is unsupported; default bootstrap still publishes its MI configuration, not this exception. No coordinator Function, fact injection or Fabric provisioning. Validation/publisher, assistant and callback ingress retained; the temporary proof workflow was removed. Raw-response capture is not built-in grounding validation, approval or package generation. Reauthentication can be required; a week-long Activator/projector schedule is not proven by this callback test.
  foundry-model:
    availability: GA
    mode: live-regional
    implementation: infra/models.bicep
    note: GPT-4o 2024-11-20, Standard capacity 30 in Sweden Central; no global processing SKU.
  validation-agent:
    availability: Custom
    mode: live
    implementation: agents.foundry
    note: Versioned Foundry prompt agent with real PNG/PDF inference; synthetic fixtures, no Content Understanding or Dataverse writes.
  validation-assessment-publisher:
    availability: Custom
    mode: deployed-manual-playground-publication-verified
    implementation: agents.flow_publish
    note: Publish-only Function and separate Foundry project MI allowlist deployed; user attached and successfully invoked its OpenAPI tool from the validation playground. Existing Fabric ingested its events and projected Blocked readiness. Source now includes optional target-bound native MI OpenAPI, generated schema and publication prompt, automatically registered by updated fresh bootstrap. Uses pinned registered photo context and explicit submitted-assessment provenance, never recursive inference or independently attested model output. Fresh-target acceptance and manual Fabric grants remain outstanding.
  closeout-agent:
    availability: Custom
    mode: live-iq-with-optional-native-fabric-test
    implementation: agents.foundry
    note: Default prompt version 9 retains scoped stub facts. Native test version 12 replaces local functions with delegated Fabric IQ while preserving the shared document IQ connection. Three-case native retrieval, gap/citation validation and rework behavior verified. Cited drafts only, no approvals/actions/packages.
  external-fabric-test:
    availability: Preview
    mode: live-synthetic-fixtures-external
    implementation: agents.fabric
    note: Existing Fabric workspace/Data Agent is outside deployment. Seventy scoped scenario/site fixtures with independently computed KQL readiness; seed validation outcomes, not fresh inference. Native UserEntraToken retrieval and separate KQL snapshot verification proved blocked, Ready and open-rework cases. Operator permissions only; denied-user isolation and production events/Activator/Dataverse are not verified.
  foundry-iq:
    availability: Preview
    mode: live-synthetic-documents
    implementation: infra/knowledge
    note: France Central Basic Search, one shared base and native azureBlob source with IQ-generated ingestion resources. Low query planning reuses the Sweden Central regional model through Search managed identity, with explicit retrieval instructions and extractive results. Project-managed-identity MCP and managed refresh verified. No per-user ACL enforcement; case citation relevance is checked separately. Old per-site pipelines retired.
  knowledge-blob:
    availability: GA
    mode: live-synthetic-documents
    implementation: agents.knowledge_setup
    note: Sweden Central private container; native source reads eight canonical text counterparts plus a labelled operator refresh note under iq/. Legacy PDF/text blobs outside that prefix remain unindexed by this source. No OCR. Shared keys and anonymous access disabled. Approved dedicated-group security-control exception documented in MANUAL_STEPS.md.
  synthetic-seed:
    availability: Custom
    mode: local
    implementation: shared.seed
    note: Provisional contract-valid fixture records and isolated defective Fabric extract.
  synthetic-evidence:
    availability: Custom
    mode: local
    implementation: shared.seed_files
    note: Labelled PNG schematics and PDF/text inputs; the offline demo uses seeded outcomes and the agent CLI can run real inference.
  readiness-activator-stub:
    availability: Custom
    mode: stub
    implementation: shared.readiness
    note: Local rule and transition simulation, not production Fabric or Dataverse writes.
  data-agent-mcp-stub:
    availability: Custom
    mode: stub
    implementation: shared.stub_mcp
    note: Local stdio get_site_facts tool with fixed site allowlist and optional validated live-photo overlay, not the live Fabric API or Entra auth.
  eventstream-ledger-stub:
    availability: Custom
    mode: stub
    implementation: shared.event_stub
    note: Local SQLite deduplication and snapshot replay, not Eventstream delivery or APIM action receipts.
  dataverse-fake:
    availability: Custom
    mode: unit-test-only
    implementation: tests/conftest.py
    note: ETag test helper; not packaged or selectable by runtime configuration.
