name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install --version v0.39.26
      - run: az bicep build --file infra/models.bicep --stdout > /dev/null
      - run: az bicep build --file infra/knowledge/main.bicep --stdout > /dev/null
      - run: az bicep build --file infra/flow/main.bicep --stdout > /dev/null
      - run: az bicep build --file infra/fresh/main.bicep --outfile infra/fresh/azuredeploy.json
      - run: git diff --exit-code -- infra/fresh/azuredeploy.json

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.7"
      - run: uv sync --frozen --extra dev --extra agents --extra flow
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev --extra agents --extra flow pytest -m "not integration"
      - run: uv run --frozen --extra dev python -m shared.contract_validation

  presenter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
